<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>มีอะไรจะบอก...</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Prompt', sans-serif;
            margin: 0;
            overflow: hidden;
            background: linear-gradient(135deg, #ffe4e6 0%, #fbcfe8 100%);
        }

        /* เอฟเฟกต์หัวใจเต้น */
        .heart-beat {
            animation: heartbeat 1.5s infinite;
        }

        @keyframes heartbeat {
            0% { transform: scale(1); filter: drop-shadow(0 0 10px rgba(244, 63, 94, 0.4)); }
            14% { transform: scale(1.15); filter: drop-shadow(0 0 20px rgba(244, 63, 94, 0.7)); }
            28% { transform: scale(1); filter: drop-shadow(0 0 10px rgba(244, 63, 94, 0.4)); }
            42% { transform: scale(1.15); filter: drop-shadow(0 0 20px rgba(244, 63, 94, 0.7)); }
            70% { transform: scale(1); filter: drop-shadow(0 0 10px rgba(244, 63, 94, 0.4)); }
        }

        /* สไตล์สำหรับ Particle (หัวใจที่ระเบิดออก) */
        .particle {
            position: absolute;
            pointer-events: none;
            z-index: 50;
            transform-origin: center center;
            animation: pop var(--duration) ease-out forwards;
        }

        @keyframes pop {
            0% { 
                transform: translate(-50%, -50%) scale(0.5); 
                opacity: 1; 
            }
            80% {
                opacity: 1;
            }
            100% { 
                transform: translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) scale(1.5) rotate(var(--rot)); 
                opacity: 0; 
            }
        }

        /* เอฟเฟกต์หัวใจลอยขึ้นด้านบน (background) */
        .floating-heart {
            position: absolute;
            bottom: -10vh;
            pointer-events: none;
            animation: floatUp linear infinite;
            opacity: 0.5;
            z-index: 1;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) rotate(0deg); opacity: 0; }
            10% { opacity: 0.6; }
            90% { opacity: 0.6; }
            100% { transform: translateY(-110vh) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body class="w-screen h-screen relative flex items-center justify-center">

    <div id="bg-hearts" class="absolute inset-0 overflow-hidden pointer-events-none"></div>

    <div id="initial-view" class="absolute z-20 flex flex-col items-center justify-center transition-all duration-700 ease-in-out transform scale-100 opacity-100 w-full px-4">
        <div id="magic-heart" class="text-[8rem] md:text-[10rem] cursor-pointer hover:scale-110 transition-transform duration-300 heart-beat select-none" style="-webkit-tap-highlight-color: transparent;">
            💝
        </div>
        <p class="mt-8 text-2xl md:text-4xl font-semibold text-rose-500 animate-pulse text-center drop-shadow-sm">
            มีอะไรจะบอก... ลองกดดูสิ!
        </p>
    </div>

    <div id="final-view" class="absolute z-30 flex flex-col items-center justify-center transition-all duration-1000 ease-in-out transform scale-50 opacity-0 pointer-events-none w-full px-4">
        <div id="message-card" class="bg-white/70 backdrop-blur-lg p-8 md:p-12 rounded-[2rem] shadow-2xl text-center max-w-lg w-full border border-white/60 transition-all duration-500">
            <h1 id="main-text" class="text-3xl md:text-5xl font-bold text-rose-600 mb-4 drop-shadow-sm leading-tight">
                ไปดูหนังด้วยกันไหม? 🎬🍿
            </h1>
            <p id="sub-text" class="text-rose-400 text-lg md:text-xl mb-8 font-medium">
                หรือจะไปหาอะไรอร่อยๆ กินด้วยกันดีน้าาา 🥰
            </p>
            
            <div id="button-group" class="flex flex-col sm:flex-row gap-4 justify-center mt-4">
                <button onclick="acceptInvitation()" class="px-8 py-3 bg-gradient-to-r from-rose-400 to-pink-500 text-white rounded-full font-semibold text-xl md:text-2xl hover:shadow-[0_0_20px_rgba(244,63,94,0.5)] hover:-translate-y-1 transition-all duration-300 active:scale-95 shadow-md">
                    ไปสิ! 💖
                </button>
                <button onclick="acceptInvitation()" class="px-8 py-3 bg-gradient-to-r from-pink-400 to-red-400 text-white rounded-full font-semibold text-xl md:text-2xl hover:shadow-[0_0_20px_rgba(251,113,133,0.5)] hover:-translate-y-1 transition-all duration-300 active:scale-95 shadow-md">
                    แน่นอน! ✨
                </button>
            </div>
        </div>
    </div>

    <script>
        // DOM Elements
        const heartBtn = document.getElementById('magic-heart');
        const initialView = document.getElementById('initial-view');
        const finalView = document.getElementById('final-view');
        const bgHeartsContainer = document.getElementById('bg-hearts');

        // สร้างหัวใจลอยเป็นพื้นหลังเรื่อยๆ
        function createBackgroundHearts() {
            setInterval(() => {
                const heart = document.createElement('div');
                heart.classList.add('floating-heart');
                heart.innerText = ['🤍', '🌸', '✨', '💕'][Math.floor(Math.random() * 4)];
                heart.style.left = Math.random() * 100 + 'vw';
                heart.style.fontSize = (Math.random() * 20 + 10) + 'px';
                heart.style.animationDuration = (Math.random() * 5 + 5) + 's';
                bgHeartsContainer.appendChild(heart);

                setTimeout(() => {
                    heart.remove();
                }, 10000);
            }, 600);
        }
        createBackgroundHearts();

        // เมื่อกดหัวใจดวงใหญ่
        heartBtn.addEventListener('click', (e) => {
            const rect = heartBtn.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;

            // 1. ซ่อนหน้าแรก
            initialView.classList.remove('scale-100', 'opacity-100');
            initialView.classList.add('scale-50', 'opacity-0', 'pointer-events-none');

            // 2. ปล่อยเอฟเฟกต์หัวใจกระจาย
            createExplosion(centerX, centerY, 60);

            // 3. โชว์หน้าข้อความ
            setTimeout(() => {
                finalView.classList.remove('scale-50', 'opacity-0', 'pointer-events-none');
                finalView.classList.add('scale-100', 'opacity-100');
                finalView.style.pointerEvents = 'auto'; // ทำให้ปุ่มกดได้
            }, 800);
        });

        // ฟังก์ชันสร้าง Particle ระเบิด
        function createExplosion(x, y, amount) {
            const emojis = ['❤️', '💖', '✨', '🌸', '🥰', '💕', '💘'];
            
            for (let i = 0; i < amount; i++) {
                const particle = document.createElement('div');
                particle.classList.add('particle');
                particle.innerText = emojis[Math.floor(Math.random() * emojis.length)];
                
                // ตั้งจุดศูนย์กลางให้อยู่ตรงกลางหัวใจที่กด
                particle.style.left = x + 'px';
                particle.style.top = y + 'px';
                
                // คำนวณทิศทางกระจายแบบสุ่ม (วงกลม)
                const angle = Math.random() * Math.PI * 2;
                // ระยะทางกระจาย (100px ถึง 500px)
                const distance = Math.random() * 400 + 100; 
                
                const tx = Math.cos(angle) * distance + 'px';
                const ty = Math.sin(angle) * distance + 'px';
                const rot = (Math.random() * 720 - 360) + 'deg';
                const duration = (Math.random() * 1 + 0.8) + 's';
                
                particle.style.setProperty('--tx', tx);
                particle.style.setProperty('--ty', ty);
                particle.style.setProperty('--rot', rot);
                particle.style.setProperty('--duration', duration);
                
                particle.style.fontSize = (Math.random() * 30 + 15) + 'px';

                document.body.appendChild(particle);

                // ลบ DOM ออกเมื่อแอนิเมชันจบ
                setTimeout(() => {
                    particle.remove();
                }, 2000);
            }
        }

        // เมื่อเป้าหมายกดปุ่มตกลง (ปุ่มไหนก็เข้าฟังก์ชันนี้)
        function acceptInvitation() {
            // ปล่อยพลุหัวใจฉลอง
            createExplosion(window.innerWidth / 2, window.innerHeight / 2, 80);
            
            // เปลี่ยนข้อความ
            const mainText = document.getElementById('main-text');
            const subText = document.getElementById('sub-text');
            const buttonGroup = document.getElementById('button-group');
            const card = document.getElementById('message-card');

            mainText.innerHTML = "เย้! ดีใจจังเลย 🎉";
            subText.innerHTML = "เดี๋ยวทักไปหานะ เตรียมตัวรอเลยยยย ❤️";
            
            // ซ่อนปุ่มแบบนุ่มนวล
            buttonGroup.style.transition = "all 0.5s ease";
            buttonGroup.style.opacity = "0";
            buttonGroup.style.transform = "scale(0.8)";
            
            setTimeout(() => {
                buttonGroup.style.display = "none";
                card.classList.add('shadow-[0_0_50px_rgba(244,63,94,0.3)]'); // เพิ่มแสงเรืองรองให้การ์ด
            }, 500);
        }
    </script>
</body>
</html>
