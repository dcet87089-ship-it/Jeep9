<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Good Night Mission 🌙✨</title>
    <!-- Google Fonts Mitr & Orbitron & Prompt -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Mitr:wght@300;400;500;600&family=Orbitron:wght@500;700;900&family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Mitr', 'Prompt', sans-serif;
            background: #030712;
            min-height: 100vh;
            min-height: 100dvh;
            overflow: hidden;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            position: relative;
            touch-action: none;
            padding: 16px;
        }

        /* ผืนฟ้าและเนบิวลาเคลื่อนไหว */
        .space-bg {
            position: absolute;
            inset: 0;
            background: 
                radial-gradient(circle at 20% 20%, rgba(147, 51, 234, 0.18) 0%, transparent 45%),
                radial-gradient(circle at 80% 80%, rgba(59, 130, 246, 0.15) 0%, transparent 45%),
                radial-gradient(circle at 50% 50%, rgba(236, 72, 153, 0.1) 0%, transparent 60%);
            pointer-events: none;
            z-index: 1;
        }

        #stars-canvas {
            position: absolute;
            inset: 0;
            z-index: 2;
        }

        /* Top Status Bar แบบ Cyber/Aesthetic */
        .top-bar {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 440px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 40px;
            padding: 8px 18px;
            box-shadow: 0 4px 25px rgba(0, 0, 0, 0.4);
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: #94a3b8;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: #22c55e;
            border-radius: 50%;
            box-shadow: 0 0 10px #22c55e;
            animation: blink 2s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .clock {
            font-family: 'Orbitron', monospace;
            font-size: 15px;
            font-weight: 700;
            color: #e2e8f0;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(226, 232, 240, 0.5);
        }

        .music-toggle {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #f1f5f9;
            padding: 5px 12px;
            border-radius: 30px;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.3s ease;
        }

        .music-toggle.playing {
            background: rgba(236, 72, 153, 0.25);
            border-color: #ec4899;
            color: #f472b6;
            box-shadow: 0 0 15px rgba(236, 72, 153, 0.4);
        }

        /* คอนเทนเนอร์การ์ดหลัก */
        .main-card {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 420px;
            background: rgba(17, 24, 39, 0.7);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 32px;
            padding: 24px 20px;
            box-shadow: 
                0 20px 50px rgba(0, 0, 0, 0.7),
                0 0 35px rgba(139, 92, 246, 0.25),
                inset 0 0 15px rgba(255, 255, 255, 0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            transition: all 0.4s ease;
        }

        /* พระจันทร์ 3D & Hologram */
        .moon-stage {
            position: relative;
            width: 130px;
            height: 130px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 12px;
            cursor: pointer;
        }

        .moon-ring {
            position: absolute;
            inset: -12px;
            border-radius: 50%;
            border: 2px dashed rgba(236, 72, 153, 0.4);
            animation: spinRing 20s linear infinite;
        }

        @keyframes spinRing {
            100% { transform: rotate(360deg); }
        }

        .moon-glow {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle, rgba(253, 224, 71, 0.5) 0%, rgba(244, 63, 94, 0.2) 50%, transparent 75%);
            border-radius: 50%;
            animation: pulseGlow 3s infinite alternate ease-in-out;
        }

        @keyframes pulseGlow {
            0% { transform: scale(0.9); opacity: 0.6; }
            100% { transform: scale(1.15); opacity: 1; filter: drop-shadow(0 0 25px rgba(253, 224, 71, 0.6)); }
        }

        .moon-avatar {
            font-size: 72px;
            z-index: 2;
            filter: drop-shadow(0 0 15px rgba(253, 224, 71, 0.8));
            animation: floatMoon 4s ease-in-out infinite alternate;
            transition: transform 0.3s ease;
        }

        .moon-stage:hover .moon-avatar, .moon-stage:active .moon-avatar {
            transform: scale(1.15) rotate(10deg);
        }

        @keyframes floatMoon {
            0% { transform: translateY(0px) rotate(-4deg); }
            100% { transform: translateY(-8px) rotate(4deg); }
        }

        /* หัวข้อเท่ๆ แบบ Cyber-Love */
        .mission-title {
            font-family: 'Orbitron', 'Mitr', sans-serif;
            font-size: 13px;
            color: #f472b6;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 6px;
            text-shadow: 0 0 10px rgba(244, 114, 182, 0.5);
        }

        .main-headline {
            font-size: 24px;
            font-weight: 600;
            background: linear-gradient(135deg, #fef08a 0%, #f472b6 50%, #c084fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
            text-shadow: 0 0 25px rgba(244, 114, 182, 0.3);
        }

        .sub-message {
            font-size: 14px;
            color: #94a3b8;
            font-weight: 300;
            line-height: 1.6;
            margin-bottom: 20px;
            padding: 0 10px;
        }

        /* หลอดพลังงานแบตเตอรี่หัวใจ */
        .battery-panel {
            width: 100%;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 14px 16px;
            margin-bottom: 18px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .battery-header {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: #cbd5e1;
        }

        .battery-bar-bg {
            width: 100%;
            height: 10px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            overflow: hidden;
            position: relative;
        }

        .battery-bar-fill {
            height: 100%;
            width: 35%;
            background: linear-gradient(90deg, #ec4899, #a855f7, #3b82f6);
            border-radius: 20px;
            transition: width 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 0 12px rgba(236, 72, 153, 0.8);
        }

        /* แผงปุ่มฟีเจอร์ลูกเล่น 3 ปุ่ม */
        .action-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            width: 100%;
            margin-bottom: 14px;
        }

        .cyber-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 18px;
            padding: 12px 6px;
            color: #e2e8f0;
            font-family: 'Mitr', sans-serif;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            transition: all 0.25s ease;
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }

        .cyber-btn .btn-icon {
            font-size: 22px;
            transition: transform 0.25s ease;
        }

        .cyber-btn:hover, .cyber-btn:active {
            background: rgba(236, 72, 153, 0.2);
            border-color: rgba(236, 72, 153, 0.6);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(236, 72, 153, 0.35);
        }

        .cyber-btn:hover .btn-icon {
            transform: scale(1.2);
        }

        /* ปุ่มสวิตช์ปิดไฟเข้านอนหลัก (Main Switch) */
        .big-sleep-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #ec4899 0%, #8b5cf6 50%, #3b82f6 100%);
            border: none;
            border-radius: 50px;
            color: #ffffff;
            font-family: 'Mitr', sans-serif;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 
                0 8px 30px rgba(236, 72, 153, 0.5),
                0 0 20px rgba(139, 92, 246, 0.4);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }

        .big-sleep-btn:hover, .big-sleep-btn:active {
            transform: scale(0.97);
            box-shadow: 0 10px 40px rgba(236, 72, 153, 0.8);
        }

        /* การ์ดสุ่มความฝันคืนนี้ (Dream Popup / Fortune) */
        .dream-modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        .dream-modal.active {
            opacity: 1;
            pointer-events: auto;
        }

        .dream-box {
            background: linear-gradient(135deg, #1e1b4b 0%, #0f172a 100%);
            border: 1.5px solid rgba(236, 72, 153, 0.4);
            border-radius: 28px;
            padding: 30px 24px;
            max-width: 360px;
            width: 100%;
            text-align: center;
            box-shadow: 0 0 50px rgba(236, 72, 153, 0.3);
            transform: scale(0.85);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .dream-modal.active .dream-box {
            transform: scale(1);
        }

        .dream-icon {
            font-size: 60px;
            margin-bottom: 12px;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .dream-title {
            font-size: 20px;
            font-weight: 600;
            color: #fef08a;
            margin-bottom: 10px;
        }

        .dream-desc {
            font-size: 15px;
            color: #cbd5e1;
            line-height: 1.6;
            margin-bottom: 22px;
        }

        .close-modal-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 10px 24px;
            border-radius: 30px;
            font-family: 'Mitr', sans-serif;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }

        /* Floating Toast */
        .toast {
            position: fixed;
            bottom: 25px;
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid rgba(236, 72, 153, 0.5);
            box-shadow: 0 10px 30px rgba(0,0,0,0.7), 0 0 15px rgba(236, 72, 153, 0.3);
            padding: 12px 24px;
            border-radius: 50px;
            color: #fef08a;
            font-size: 14px;
            z-index: 99;
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        /* ละอองนีออนตามนิ้วสัมผัส */
        .touch-spark {
            position: fixed;
            pointer-events: none;
            z-index: 999;
            border-radius: 50%;
            background: radial-gradient(circle, #f472b6, transparent);
            animation: sparkFade 1s forwards ease-out;
        }

        @keyframes sparkFade {
            0% { transform: scale(0.3); opacity: 1; }
            100% { transform: scale(2.5); opacity: 0; }
        }

        /* Footer มินิมอล */
        .footer-note {
            position: relative;
            z-index: 10;
            font-size: 12px;
            color: #64748b;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <div class="space-bg"></div>
    <canvas id="stars-canvas"></canvas>

    <!-- Top Status Bar -->
    <div class="top-bar">
        <div class="status-badge">
            <div class="status-dot"></div>
            <span>NIGHT PROTOCOL</span>
        </div>
        <div class="clock" id="live-clock">00:00:00</div>
        <button class="music-toggle" id="music-btn" onclick="toggleLoFiMusic()">
            <span id="music-icon">🎵</span>
            <span id="music-text">Lo-Fi</span>
        </button>
    </div>

    <!-- Main Mission Card -->
    <div class="main-card">
        <!-- Interactive Moon Stage -->
        <div class="moon-stage" onclick="tapMoon()">
            <div class="moon-ring"></div>
            <div class="moon-glow"></div>
            <div class="moon-avatar" id="moon-char">🌙</div>
        </div>

        <div class="mission-title">Mission: Sweet Dreams</div>
        <h1 class="main-headline" id="main-title">เหนื่อยไหม... คืนนี้พักผ่อนนะ</h1>
        <p class="sub-message" id="sub-desc">
            วันนี้เธอทำหน้าที่ของตัวเองได้ดีที่สุดแล้วนะ ✨<br>
            ถึงเวลาปิดสวิตช์ความกังวล แล้วชาร์จพลังใจให้เต็มที่นะคะ
        </p>

        <!-- Battery Recharger Panel -->
        <div class="battery-panel">
            <div class="battery-header">
                <span>พลังงานกาย & ใจวันนี้:</span>
                <span id="battery-percent" style="font-family: 'Orbitron'; font-weight: 700; color: #ec4899;">35%</span>
            </div>
            <div class="battery-bar-bg">
                <div class="battery-bar-fill" id="battery-bar"></div>
            </div>
        </div>

        <!-- Action Grid: 3 Interactive Features -->
        <div class="action-grid">
            <button class="cyber-btn" onclick="chargeBattery()">
                <span class="btn-icon">⚡</span>
                <span>ชาร์จพลัง</span>
            </button>
            <button class="cyber-btn" onclick="openDreamFortune()">
                <span class="btn-icon">🔮</span>
                <span>สุ่มฝันคืนนี้</span>
            </button>
            <button class="cyber-btn" onclick="sendWarmHug()">
                <span class="btn-icon">🫂</span>
                <span>กอดข้ามจอ</span>
            </button>
        </div>

        <!-- Big Sleep Button -->
        <button class="big-sleep-btn" id="sleep-btn" onclick="activateSleepMode()">
            <span>🛌</span>
            <span id="sleep-btn-text">ส่งเข้านอน & ปิดไฟนะ 💤</span>
        </button>
    </div>

    <div class="footer-note">✦ TAP SCREEN TO CREATE SHOOTING STARS ✦</div>

    <!-- Modal สุ่มความฝันคืนนี้ (Dream Fortune) -->
    <div class="dream-modal" id="dream-modal">
        <div class="dream-box">
            <div class="dream-icon" id="dream-icon">🌌</div>
            <h3 class="dream-title" id="dream-title">ความฝันของคุณคืนนี้</h3>
            <p class="dream-desc" id="dream-desc">...</p>
            <button class="close-modal-btn" onclick="closeDreamFortune()">รับทราบ & เตรียมไปฝัน 🤍</button>
        </div>
    </div>

    <!-- Toast Notification -->
    <div class="toast" id="toast"></div>

    <script>
        // 1. Live Digital Clock (เวลาจริง)
        function updateClock() {
            const now = new Date();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            const s = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('live-clock').innerText = `${h}:${m}:${s}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // 2. Interactive Canvas Stars + Constellation Lines
        const canvas = document.getElementById('stars-canvas');
        const ctx = canvas.getContext('2d');
        let stars = [];
        let mouse = { x: null, y: null };

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            initStars();
        }

        function initStars() {
            stars = [];
            const count = Math.min(100, Math.floor((canvas.width * canvas.height) / 8000));
            for (let i = 0; i < count; i++) {
                stars.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    vx: (Math.random() - 0.5) * 0.3,
                    vy: (Math.random() - 0.5) * 0.3,
                    radius: Math.random() * 1.5 + 0.5,
                    alpha: Math.random() * 0.7 + 0.3
                });
            }
        }

        function animateStars() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Draw lines between nearby stars
            for (let i = 0; i < stars.length; i++) {
                for (let j = i + 1; j < stars.length; j++) {
                    const dx = stars[i].x - stars[j].x;
                    const dy = stars[i].y - stars[j].y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < 90) {
                        ctx.beginPath();
                        ctx.moveTo(stars[i].x, stars[i].y);
                        ctx.lineTo(stars[j].x, stars[j].y);
                        ctx.strokeStyle = `rgba(168, 85, 247, ${0.2 * (1 - dist / 90)})`;
                        ctx.lineWidth = 0.5;
                        ctx.stroke();
                    }
                }
            }

            // Move & Draw stars
            for (let s of stars) {
                s.x += s.vx;
                s.y += s.vy;
                if (s.x < 0 || s.x > canvas.width) s.vx *= -1;
                if (s.y < 0 || s.y > canvas.height) s.vy *= -1;

                ctx.beginPath();
                ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(254, 240, 138, ${s.alpha})`;
                ctx.fill();
            }

            requestAnimationFrame(animateStars);
        }

        window.addEventListener('resize', resize);
        resize();
        animateStars();

        // 3. Touch/Click Particle trail (แตะหน้าจอแล้วมีประกายดาวพุ่ง)
        window.addEventListener('pointerdown', (e) => {
            createSparkle(e.clientX, e.clientY);
        });

        function createSparkle(x, y) {
            const el = document.createElement('div');
            el.className = 'touch-spark';
            el.style.left = (x - 15) + 'px';
            el.style.top = (y - 15) + 'px';
            el.style.width = '30px';
            el.style.height = '30px';
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 1000);
        }

        // 4. Synthesizer Lo-Fi Music Box (เสียงดนตรีกล่อมนอนจริง สังเคราะห์สด)
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        let audioCtx;
        let isMusicPlaying = false;
        let lofiInterval;

        const lofiChords = [
            [261.63, 329.63, 392.00, 493.88], // Cmaj7
            [220.00, 261.63, 329.63, 392.00], // Am7
            [174.61, 220.00, 261.63, 329.63], // Fmaj7
            [196.00, 246.94, 293.66, 349.23]  // G7
        ];
        let chordIndex = 0;

        function playChordNote(freq, delay) {
            setTimeout(() => {
                try {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

                    gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 2.2);

                    osc.connect(gain);
                    gain.connect(audioCtx.destination);

                    osc.start();
                    osc.stop(audioCtx.currentTime + 2.2);
                } catch(e) {}
            }, delay);
        }

        function toggleLoFiMusic() {
            if (!audioCtx) audioCtx = new AudioCtx();
            if (audioCtx.state === 'suspended') audioCtx.resume();

            const btn = document.getElementById('music-btn');
            const icon = document.getElementById('music-icon');
            const text = document.getElementById('music-text');

            if (!isMusicPlaying) {
                isMusicPlaying = true;
                btn.classList.add('playing');
                icon.innerText = '⏸️';
                text.innerText = 'Playing';
                showToast('🎵 กำลังเปิดดนตรีกล่อมนอน Lo-Fi สบายๆ ให้นะคะ');

                // Loop Lofi chords
                lofiInterval = setInterval(() => {
                    const chord = lofiChords[chordIndex % lofiChords.length];
                    chord.forEach((freq, idx) => {
                        playChordNote(freq, idx * 160);
                    });
                    chordIndex++;
                }, 2800);

                // Play first chord immediately
                const chord = lofiChords[0];
                chord.forEach((freq, idx) => playChordNote(freq, idx * 160));
            } else {
                isMusicPlaying = false;
                btn.classList.remove('playing');
                icon.innerText = '🎵';
                text.innerText = 'Lo-Fi';
                clearInterval(lofiInterval);
                showToast('⏸️ ปิดเสียงดนตรีเรียบร้อย');
            }
        }

        // 5. Sound Effect Generator (Chime / Powerup)
        function playChime(freq = 523.25) {
            try {
                if (!audioCtx) audioCtx = new AudioCtx();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.2);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 1.2);
            } catch(e) {}
        }

        // 6. Interactive Actions
        // A. แตะพระจันทร์
        function tapMoon() {
            playChime(659.25);
            const avatars = ['🌙', '⭐', '😴', '🧸', '🤍', '✨'];
            const moon = document.getElementById('moon-char');
            moon.innerText = avatars[Math.floor(Math.random() * avatars.length)];
            showToast('✨ พระจันทร์ส่งความอบอุ่นมาให้เธอแล้วนะ!');
        }

        // B. ชาร์จพลังงาน 100%
        let isCharged = false;
        function chargeBattery() {
            playChime(587.33);
            setTimeout(() => playChime(880), 120);

            const fill = document.getElementById('battery-bar');
            const percent = document.getElementById('battery-percent');
            
            fill.style.width = '100%';
            fill.style.background = 'linear-gradient(90deg, #22c55e, #3b82f6, #ec4899)';
            percent.innerText = '100% [FULL]';
            percent.style.color = '#22c55e';
            
            showToast('⚡ ชาร์จพลังใจเต็ม 100%! พรุ่งนี้พร้อมลุยต่อแน่นอน 💪');
        }

        // C. สุ่มความฝันคืนนี้ (Dream Fortune)
        const fortunes = [
            { icon: '🏖️', title: 'ฝันเห็นทริปพักผ่อนแสนสุข', desc: 'คืนนี้เธอจะได้ฝันว่าได้ไปนอนชิลริมทะเล ฟังเสียงคลื่นรับลมเย็นๆ ตื่นมาแล้วตัวเบาสบายไร้ความเครียดเลยล่ะ!' },
            { icon: '🥐', title: 'ฝันว่าได้กินของโปรดไม่อั้น', desc: 'คืนนี้เธอจะได้ฝันถึงบุฟเฟต์ของอร่อย ขนมหวานที่ชอบ กินเท่าไหร่ก็ไม่อ้วน ฟินสุดๆ ในความฝันเลย!' },
            { icon: '✨', title: 'ฝันเห็นเรื่องมหัศจรรย์', desc: 'คืนนี้เธอจะได้ฝันว่าสามารถบินได้ในท้องฟ้ากว้าง มีแต่เรื่องดีๆ และรอยยิ้มคอยโอบกอดเธอไว้ทั้งคืน' },
            { icon: '🧸', title: 'ฝันว่าได้นอนเต็มอิ่ม 10 ชั่วโมง', desc: 'ความฝันอันเงียบสงบ ไม่มีเรื่องกวนใจ สมองได้พักผ่อนเต็มที่ ตื่นมาสดชื่นพร้อมรอยยิ้มสดใสในเช้าวันใหม่' },
            { icon: '🤍', title: 'ฝันเห็นคนน่ารักที่คิดถึง', desc: 'คืนนี้ในความฝันจะมีคนคนนึงมายืนยิ้มให้เธอ และคอยบอกเธอว่า "เก่งมากแล้วนะคนดี" ฝันถึงเราด้วยนะ!' }
        ];

        function openDreamFortune() {
            playChime(783.99);
            const random = fortunes[Math.floor(Math.random() * fortunes.length)];
            document.getElementById('dream-icon').innerText = random.icon;
            document.getElementById('dream-title').innerText = random.title;
            document.getElementById('dream-desc').innerText = random.desc;
            document.getElementById('dream-modal').classList.add('active');
        }

        function closeDreamFortune() {
            playChime(523.25);
            document.getElementById('dream-modal').classList.remove('active');
        }

        // D. กอดข้ามจอ
        function sendWarmHug() {
            playChime(698.46);
            showToast('🫂 ส่งกอดแน่นๆ ผ่านหน้าจอไปให้แล้วนะ อบอุ่นไหม? 🤍');
            
            // ปล่อยหัวใจลอย
            for (let i = 0; i < 15; i++) {
                setTimeout(() => {
                    const el = document.createElement('div');
                    el.innerText = '🤍';
                    el.style.position = 'fixed';
                    el.style.left = (Math.random() * 80 + 10) + 'vw';
                    el.style.bottom = '10vh';
                    el.style.fontSize = (Math.random() * 20 + 20) + 'px';
                    el.style.transition = 'all 2s ease-out';
                    el.style.zIndex = '999';
                    el.style.opacity = '1';
                    document.body.appendChild(el);

                    setTimeout(() => {
                        el.style.transform = 'translateY(-60vh) scale(1.5)';
                        el.style.opacity = '0';
                    }, 50);

                    setTimeout(() => el.remove(), 2100);
                }, i * 80);
            }
        }

        // E. สวิตช์ปิดไฟเข้านอนหลัก (Sleep Mode Activated)
        let isSleepMode = false;
        function activateSleepMode() {
            playChime(440);
            setTimeout(() => playChime(392), 200);
            setTimeout(() => playChime(329.63), 400);

            const title = document.getElementById('main-title');
            const desc = document.getElementById('sub-desc');
            const btnText = document.getElementById('sleep-btn-text');
            const moon = document.getElementById('moon-char');

            if (!isSleepMode) {
                isSleepMode = true;
                title.innerText = "หลับตาลงนะ... ราตรีสวัสดิ์ 💤";
                desc.innerHTML = "ปิดสวิตช์โลกใบนี้เรียบร้อยแล้ว 🌙<br>ห่มผ้าให้อุ่นๆ ขอให้คืนนี้มีแต่ฝันที่แสนดีนะคนเก่ง 🤍";
                btnText.innerText = "กู๊ดไนท์นะ ฝันดีครับ 💖";
                moon.innerText = "😴";
                document.body.style.filter = "brightness(0.85)";
                showToast('🌙 หรี่ไฟและส่งเข้านอนแล้ว... ฝันดีนะคะ 💤');
            } else {
                showToast('😴 หลับปุ๋ยได้แล้วน้าา อย่าแอบเล่นมือถือดึกล่ะ!');
            }
        }

        // Helper: Toast
        let toastTimeout;
        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.classList.add('show');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }
    </script>
