<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Heart Animation</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;600&family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="webgl-container"></div>
    
    <!-- Floating Heart Photo Balloons Container -->
    <div id="balloons-container" class="balloons-container"></div>

    <!-- Gate Overlay Modal -->
    <div id="gate-overlay" class="gate-overlay">
        <div class="gate-backdrop"></div>
        <div class="gate-card">
            <div class="gate-icon-wrap">
                <span class="gate-icon">💌</span>
                <span class="gate-sparkle sparkle-1">✨</span>
                <span class="gate-sparkle sparkle-2">💖</span>
            </div>
            <h2 class="gate-title">มีกำลังใจมาส่งคับบ ✨</h2>
            <p class="gate-desc">มีของขวัญพิเศษรออยู่ข้างใน อยากให้เปิดดูจังเลยยย 💖</p>
            
            <div class="gate-actions" id="gate-actions">
                <button id="btn-accept" class="btn-accept" type="button">
                    <span>รับเลยยย 💖</span>
                </button>
                <button id="btn-reject" class="btn-reject" type="button">
                    <span id="reject-text">ไม่รับ 😜</span>
                </button>
            </div>
        </div>
    </div>

    <div class="ui-container" id="ui-container">
        <h1 class="title">Special For You 💖</h1>
        <p class="sub-hint">Drag to rotate • Tap to feel beat</p>
    </div>

    <!-- Import maps polyfill & Three.js ES Modules -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>
    <script type="module" src="script.js"></script>
</body>
</html>
